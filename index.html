<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Sinalização Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .media-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .active { display: block; }
    #status-log { position: absolute; bottom: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 12px; z-index: 100; background: rgba(0,0,0,0.7); padding: 5px; }
  </style>
</head>
<body>

  <div id="player-container">
    <img id="img-display" class="media-element" alt="Anúncio Comercial" />
    <div id="status-log">Carregando mídias do Google Drive...</div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwX6laG5CxgViS-b-HE2VlRGSV3rkD3jAHUkG39H-gtXTXnk-xzCwjaWhH2HEHS3oB2/exec';

    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    const imgDisplay = document.getElementById('img-display');
    const logEl = document.getElementById('status-log');

    function log(msg) {
      if (logEl) logEl.innerText = msg;
    }

    // Função global acionada pelo script do Google (JSONP)
    window.loadPlaylist = function(data) {
      if (Array.isArray(data) && data.length > 0) {
        playlist = data;
        log(`Mídias carregadas: ${data.length}`);
        setTimeout(() => { if(logEl) logEl.style.display = 'none'; }, 3000);

        if (!timer && !imgDisplay.classList.contains('active')) {
          playNext();
        }
      } else {
        log("Nenhuma imagem encontrada na pasta do Drive.");
      }
    };

    function fetchDriveFolderFiles() {
      log("Conectando ao Google Drive...");
      
      // Remove script anterior se existir
      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      // Cria a tag script dinamicamente para burlar o CORS
      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${SCRIPT_URL}?callback=loadPlaylist&t=${new Date().getTime()}`;
      script.onerror = () => log("Erro de conexão ao carregar o script.");
      document.body.appendChild(script);
    }

    function playNext() {
      if (playlist.length === 0) return;

      imgDisplay.classList.remove('active');

      const item = playlist[currentIndex];

      if (item.type === 'image') {
        imgDisplay.src = item.src;
        imgDisplay.classList.add('active');
        
        timer = setTimeout(() => {
          advanceIndex();
          playNext();
        }, item.duration || 8000);
      }
    }

    function advanceIndex() {
      currentIndex = (currentIndex + 1) % playlist.length;
    }

    window.onload = () => {
      fetchDriveFolderFiles();
      setInterval(fetchDriveFolderFiles, 300000); // Atualiza a cada 5 minutos
    };
  </script>
</body>
</html>
