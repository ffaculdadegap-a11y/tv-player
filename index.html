<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Sinalização Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .media-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .active { display: block; }
    #standby-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000; z-index: 99; display: none; }
  </style>
</head>
<body>

  <div id="player-container">
    <img id="img-display" class="media-element" alt="Anúncio Comercial" />
    <video id="video-display" class="media-element" muted playsinline></video>
    <div id="standby-screen"></div>
  </div>

  <script>
    // 1. ALTERE SUAS MÍDIAS AQUI (Coloque os links diretos das suas imagens/vídeos)
    let playlist = [
      { type: 'image', src: 'https://picsum.photos/id/1060/1920/1080', duration: 5000 },
      { type: 'image', src: 'https://picsum.photos/id/1018/1920/1080', duration: 5000 }
    ];

    let currentIndex = 0;
    let isClassActive = false;
    let timer = null;

    const imgDisplay = document.getElementById('img-display');
    const videoDisplay = document.getElementById('video-display');
    const standbyScreen = document.getElementById('standby-screen');

    function playNext() {
      if (isClassActive) return;

      imgDisplay.classList.remove('active');
      videoDisplay.classList.remove('active');
      videoDisplay.pause();

      if (playlist.length === 0) return;

      const item = playlist[currentIndex];

      if (item.type === 'image') {
        imgDisplay.src = item.src;
        imgDisplay.classList.add('active');
        
        timer = setTimeout(() => {
          advanceIndex();
          playNext();
        }, item.duration || 5000);

      } else if (item.type === 'video') {
        videoDisplay.src = item.src;
        videoDisplay.classList.add('active');
        videoDisplay.play();

        videoDisplay.onended = () => {
          advanceIndex();
          playNext();
        };
      }
    }

    function advanceIndex() {
      currentIndex = (currentIndex + 1) % playlist.length;
    }

    function enableFullScreen() {
      const docEl = document.documentElement;
      if (docEl.requestFullscreen) { docEl.requestFullscreen(); }
      else if (docEl.webkitRequestFullscreen) { docEl.webkitRequestFullscreen(); }
    }

    window.onload = () => {
      document.body.addEventListener('click', enableFullScreen, { once: true });
      playNext();
    };
  </script>
</body>
</html>
