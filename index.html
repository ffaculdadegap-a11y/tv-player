<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Sinalização Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .media-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .active { display: block; }
    #status-log { position: absolute; bottom: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 12px; z-index: 100; background: rgba(0,0,0,0.7); padding: 5px; }
  </style>
</head>
<body>

  <div id="player-container">
    <img id="img-display" class="media-element" alt="Anúncio Comercial" />
    <div id="status-log">Carregando mídias da pasta...</div>
  </div>

  <script>
    // ID da pasta "Painel - TV" extraído da URL do Google Drive
    const FOLDER_ID = '13_3sFHmComXi5js05_xycBM534hphga';

    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    const imgDisplay = document.getElementById('img-display');
    const logEl = document.getElementById('status-log');

    function log(msg) {
      if (logEl) logEl.innerText = msg;
    }

    // Processa o feed XML público da pasta do Drive
    window.parseDriveFeed = function(data) {
      try {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data, "text/xml");
        const entries = xmlDoc.getElementsByTagName("entry");

        playlist = [];

        for (let i = 0; i < entries.length; i++) {
          const entry = entries[i];
          const idEl = entry.getElementsByTagName("id")[0];
          
          if (idEl) {
            const fullId = idEl.textContent;
            const fileId = fullId.split('/').pop().split('?')[0];

            // Monta o link direto de renderização de imagem do Googleusercontent
            playlist.push({
              src: `https://lh3.googleusercontent.com/d/${fileId}`,
              duration: 8000
            });
          }
        }

        if (playlist.length > 0) {
          log(`Mídias carregadas com sucesso: ${playlist.length}`);
          setTimeout(() => { if (logEl) logEl.style.display = 'none'; }, 3000);

          if (!timer && !imgDisplay.classList.contains('active')) {
            playNext();
          }
        } else {
          log("Nenhum arquivo público encontrado na pasta.");
        }
      } catch (e) {
        log("Erro ao processar dados da pasta.");
        console.error(e);
      }
    };

    function loadFolderContent() {
      log("Acessando pasta pública...");
      
      const oldScript = document.getElementById('feed-script');
      if (oldScript) oldScript.remove();

      // Utiliza a ponte YQL/AllOrigins para converter o RSS público da pasta sem bloqueio de CORS ou API Key
      const feedUrl = `https://drive.google.com/host/${FOLDER_ID}`;
      const script = document.createElement('script');
      script.id = 'feed-script';
      script.src = `https://api.allorigins.win/get?url=${encodeURIComponent('https://docs.google.com/feeds/xml/folder/' + FOLDER_ID)}&callback=handleAllOrigins`;
      
      window.handleAllOrigins = function(response) {
        if (response && response.contents) {
          parseDriveFeed(response.contents);
        } else {
          log("Erro de acesso ao conteúdo da pasta.");
        }
      };

      document.body.appendChild(script);
    }

    function playNext() {
      if (playlist.length === 0) return;

      imgDisplay.classList.remove('active');

      const item = playlist[currentIndex];
      imgDisplay.src = item.src;
      imgDisplay.classList.add('active');

      timer = setTimeout(() => {
        advanceIndex();
        playNext();
      }, item.duration || 8000);
    }

    function advanceIndex() {
      currentIndex = (currentIndex + 1) % playlist.length;
    }

    window.onload = () => {
      loadFolderContent();
      setInterval(loadFolderContent, 300000); // Recarrega novidades da pasta a cada 5 minutos
    };
  </script>
</body>
</html>
