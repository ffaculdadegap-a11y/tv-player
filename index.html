<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Sinalização Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .media-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .active { display: block; }
    #status-log { position: absolute; bottom: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 12px; z-index: 100; background: rgba(0,0,0,0.7); padding: 5px; }
  </style>
</head>
<body>

  <div id="player-container">
    <img id="img-display" class="media-element" alt="Anúncio Comercial" />
    <div id="status-log">Iniciando busca de mídias...</div>
  </div>

  <script>
    // Configurações principais
    const FOLDER_ID = '13_3sFHmComXi5js05_xycBM534hphga'; // ID da pasta Painel - TV
    const API_KEY = 'COLE_SUA_API_KEY_AQUI'; // Insira a API Key do Google Cloud / AI Studio

    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    const imgDisplay = document.getElementById('img-display');
    const logEl = document.getElementById('status-log');

    function log(msg) {
      if (logEl) logEl.innerText = msg;
    }

    async function loadDriveFiles() {
      log("Conectando ao Google Drive API...");
      
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+trashed=false&fields=files(id,mimeType)&key=${API_KEY}`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.error) {
          log("Erro na API: " + data.error.message);
          return;
        }

        if (data.files && data.files.length > 0) {
          // Filta apenas imagens
          const images = data.files.filter(f => f.mimeType.startsWith('image/'));

          if (images.length === 0) {
            log("Nenhuma imagem encontrada na pasta.");
            return;
          }

          playlist = images.map(file => ({
            src: `https://lh3.googleusercontent.com/d/${file.id}`,
            duration: 8000
          }));

          log(`Mídias carregadas: ${playlist.length}`);
          setTimeout(() => { if (logEl) logEl.style.display = 'none'; }, 3000);

          if (!timer && !imgDisplay.classList.contains('active')) {
            playNext();
          }
        } else {
          log("Nenhum arquivo encontrado na pasta.");
        }
      } catch (err) {
        log("Erro de conexão ao buscar mídias.");
        console.error(err);
      }
    }

    function playNext() {
      if (playlist.length === 0) return;

      imgDisplay.classList.remove('active');

      const item = playlist[currentIndex];
      imgDisplay.src = item.src;
      imgDisplay.classList.add('active');

      timer = setTimeout(() => {
        advanceIndex();
        playNext();
      }, item.duration || 8000);
    }

    function advanceIndex() {
      currentIndex = (currentIndex + 1) % playlist.length;
    }

    window.onload = () => {
      loadDriveFiles();
      setInterval(loadDriveFiles, 300000); // Atualiza o conteúdo a cada 5 minutos
    };
  </script>
</body>
</html>
