<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player de Sinalização Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    .media-element { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
    .active { display: block; }
    #status-log { position: absolute; bottom: 10px; left: 10px; color: #00ff00; font-family: monospace; font-size: 12px; z-index: 100; background: rgba(0,0,0,0.7); padding: 5px; }
  </style>
</head>
<body>

  <div id="player-container">
    <img id="img-display" class="media-element" alt="Anúncio Comercial" />
    <div id="status-log">A carregar mídias do Google Drive...</div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwX6laG5CxgViS-b-HE2VIRGSV3rkD3jAHUkG39H-gtXTXnk-xzCwjaWhH2HEHS3oB2/exec';

    let playlist = [];
    let currentIndex = 0;
    let timer = null;

    const imgDisplay = document.getElementById('img-display');
    const logEl = document.getElementById('status-log');

    function log(msg) {
      if (logEl) logEl.innerText = msg;
    }

    async function fetchDriveFolderFiles() {
      try {
        log("A ligar ao Google Drive...");
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();

        if (Array.isArray(data) && data.length > 0) {
          playlist = data;
          log(`Mídias carregadas com sucesso: ${data.length}`);
          setTimeout(() => { if(logEl) logEl.style.display = 'none'; }, 3000);

          if (!timer && !imgDisplay.classList.contains('active')) {
            playNext();
          }
        } else {
          log("Nenhuma imagem encontrada na pasta.");
        }
      } catch (error) {
        log("Erro ao carregar mídias.");
        console.error(error);
      }
    }

    function playNext() {
      if (playlist.length === 0) return;

      imgDisplay.classList.remove('active');

      const item = playlist[currentIndex];

      if (item.type === 'image') {
        imgDisplay.src = item.src;
        imgDisplay.classList.add('active');
        
        timer = setTimeout(() => {
          advanceIndex();
          playNext();
        }, item.duration || 8000);
      }
    }

    function advanceIndex() {
      currentIndex = (currentIndex + 1) % playlist.length;
    }

    window.onload = async () => {
      await fetchDriveFolderFiles();
      setInterval(fetchDriveFolderFiles, 300000);
    };
  </script>
</body>
</html>
